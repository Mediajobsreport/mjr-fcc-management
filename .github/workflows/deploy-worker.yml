name: Deploy MJR FCC Worker
on:
  push:
    branches: [main]
    paths:
      - 'fcc_transactions_worker.js'
      - 'fcc_service.js'
      - 'package.json'
      - 'wrangler.toml'
      - 'index.html'
      - 'public/index.html'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

